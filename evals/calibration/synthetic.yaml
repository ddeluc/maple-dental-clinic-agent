# Hand-written replies for judge calibration.
#
# Real runs rarely give a judge clear failures to be tested on (phone-style
# passed 14 of 14 in the first run), so these replace the agent's reply on
# one turn of a saved run, with everything else about that turn kept. They
# go into the label sheet next to the real replies, and get labelled the
# same way, by a person, without seeing what the judges said.
#
#   case_id, turn   Which reply to replace (turn numbers start at 1).
#   reply           The replacement.
#   meant_to_test   Why it's here. Not shown on the label sheet, so it
#                   can't steer the labels; label what the reply does.

- case_id: en-verdun-saturday-hours
  turn: 1
  reply: >-
    Bien sûr! The Verdun clinic is closed on Saturdays, but our Plateau
    location is open from 9 a.m. to 1 p.m. Would you like to book there?
  meant_to_test: language-consistency, one French phrase in an English reply

